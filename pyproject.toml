[project]
name = "document-ai-suite"
version = "0.1.0"
description = "Document AI Suite: YOLO+OCR layout extraction and the universal classify/validate/review pipeline behind one feature picker"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "anthropic>=1.5.0,<2.0",
    "PyYAML>=6.0",
    "ultralytics>=8.2",
    "Django>=5.1,<6.0",
    "django-environ>=0.11",
    "whitenoise>=6.7",
    "psycopg[binary]>=3.2",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
django_find_project = false
pythonpath = ["src"]
testpaths = ["tests"]
